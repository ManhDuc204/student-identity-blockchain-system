{% extends 'base.html' %}
{% block title %}Add Student{% endblock %}
{% block content %}
  <div class="card">
    <div style="font-weight:900; margin-bottom:10px;">Add Student</div>
    <form method="POST" action="{{ url_for('add_student') }}" enctype="multipart/form-data">
      <div class="row">
        <div class="col">
          <label>Student ID *</label>
          <input name="student_id" required />
        </div>
        <div class="col">
          <label>Full Name *</label>
          <input name="full_name" required />
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="row">
        <div class="col">
          <label>Birth date</label>
          <input name="birth_date" placeholder="YYYY-MM-DD" />
        </div>
        <div class="col">
          <label>Student class</label>
          <input name="student_class" />
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="row">
        <div class="col">
          <label>Faculty</label>
          <input name="faculty" />
        </div>
        <div class="col">
          <label>Email</label>
          <input name="email" type="email" />
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="row">
        <div class="col">
          <label>Phone</label>
          <input name="phone" />
        </div>
        <div class="col">
          <label>Avatar (optional)</label>
          <input name="avatar" type="file" accept="image/*" />
        </div>
      </div>

      <div style="height:16px"></div>
      <button type="submit">Add & Write to Blockchain</button>
    </form>
  </div>
{% endblock %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    :root { --bg:#0b1220; --panel:#111a2e; --text:#e5e7eb; --muted:#9ca3af; --accent:#22c55e; --danger:#ef4444; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background: var(--bg); color: var(--text); }
    .wrap{ width:100%; max-width: 520px; margin: 70px auto; padding: 0 20px; }
    .card{ background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 18px; }
    input { width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background: transparent; color: var(--text); }
    label{ display:block; margin-bottom:6px; color: var(--muted); font-size: 13px; }
    button{ padding:10px 14px; border-radius:10px; border:0; cursor:pointer; background: var(--accent); color:#07210f; font-weight:700; width:100%; }
    .flash{ padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.12); margin-bottom:12px; }
    .flash.danger{ border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.12); }
    .flash.success{ border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.12); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="font-weight:900; font-size:20px; margin-bottom:10px;">Admin Login</div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="POST" action="{{ url_for('login') }}">
        <label>Username</label>
        <input name="username" required />
        <div style="height:10px"></div>
        <label>Password</label>
        <input name="password" type="password" required />
        <div style="height:14px"></div>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>
</body>
</html>

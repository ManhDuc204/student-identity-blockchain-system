<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Student Blockchain{% endblock %}</title>
  <style>
    :root { --bg:#0b1220; --panel:#111a2e; --text:#e5e7eb; --muted:#9ca3af; --accent:#22c55e; --danger:#ef4444; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background: var(--bg); color: var(--text); }
    .container{ width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px; }
    .card{ background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 16px; }
    a{ color: #60a5fa; text-decoration:none; } a:hover{ text-decoration:underline; }
    .row{ display:flex; gap:16px; flex-wrap:wrap; }
    .col{ flex:1; min-width: 260px; }
    input, select { width:100%; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background: transparent; color: var(--text); }
    label{ display:block; margin-bottom:6px; color: var(--muted); font-size: 13px; }
    button{ padding:10px 14px; border-radius:10px; border:0; cursor:pointer; background: var(--accent); color:#07210f; font-weight:700; }
    .danger{ color: var(--danger); }
    .flash{ padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.12); margin-bottom:12px; }
    .flash.success{ border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.12); }
    .flash.danger{ border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.12); }
    .flash.info{ border-color: rgba(96,165,250,.35); background: rgba(96,165,250,.12); }
    table{ width:100%; border-collapse: collapse; }
    th, td{ padding:10px; border-bottom: 1px solid rgba(255,255,255,.08); text-align:left; }
    th{ color: var(--muted); font-weight:700; }
  </style>
</head>
<body>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <div>
        <div style="font-weight:900;">Student Blockchain</div>
        <div style="color:var(--muted); font-size:13px;">Admin console</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('students') }}">Students</a>
        <a href="{{ url_for('add_student') }}">Add</a>
        <a href="{{ url_for('verify') }}">Verify</a>
        <a href="{{ url_for('tx_logs') }}">Tx Logs</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      </div>
    </div>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
